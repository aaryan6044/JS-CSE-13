<!DOCTYPE html>
<html>
<head>
    <title>Digital Clock</title>
    <style>
        body{
            text-align:center;
            font-family:Arial;
            margin-top:150px;
        }

        #clock{
            font-size:50px;
            font-weight:bold;
            color:blue;
        }
    </style>
</head>
<body>

<h1>Digital Clock</h1>

<div id="clock"></div>

<script>
function showTime(){
    let d = new Date();

    let h = d.getHours();
    let m = d.getMinutes();
    let s = d.getSeconds();

    document.getElementById("clock").innerHTML =
    h + ":" + m + ":" + s;
}

setInterval(showTime,1000);
</script>

</body>
</html>
